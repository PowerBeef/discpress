# Rebuilds the WebAssembly from the sources with the pinned Emscripten (build.sh) and checks that the
# page comes out byte for byte the dist/discpress.html in the repository, the file releases ship.
# scripts/check-dist.sh (run by CI and by every release) checks that the page records the sources it
# was built from, a hash build.sh writes itself; this checks the build itself, on another machine.
# Runs when the engine, its build or the committed page changes, weekly, and on demand. A second job builds
# the same sources with WebAssembly's new exception format (exnref) and runs the conversion tests on it.
name: Rebuild

on:
  push:
    branches: [main]
    paths: ['engine/**', 'wasm/**', 'build.sh', 'dist/**', 'scripts/engine-sources.py', 'scripts/assemble.py', '.github/workflows/rebuild.yml']
  pull_request:
    paths: ['engine/**', 'wasm/**', 'build.sh', 'dist/**', 'scripts/engine-sources.py', 'scripts/assemble.py', '.github/workflows/rebuild.yml']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Emscripten 6.0.10
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/emsdk
          key: emsdk-6.0.10-${{ runner.os }}
      - name: Emscripten 6.0.10 (emsdk)
        run: |
          [ -d ~/emsdk/.git ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install 6.0.10
          ./emsdk activate 6.0.10
      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          ./build.sh
      - name: The page is the one in the repository, byte for byte
        run: |
          if git diff --quiet -- dist/discpress.html; then
            echo "dist/discpress.html rebuilt byte for byte ($(sha256sum dist/discpress.html | cut -c1-64))"
          else
            echo "::error::A clean build of these sources doesn't give the committed dist/discpress.html"
            git diff --stat -- dist/discpress.html
            exit 1
          fi
      - name: The rebuilt page, when it differs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebuilt-discpress
          path: |
            dist/discpress.html
            build/chdman.wasm
            build/chdman-nosimd.wasm
            build/chdman.js
          retention-days: 14

  # The same sources with WebAssembly's new exception format (exnref, WASM_EH=exnref in build.sh), so that
  # switching to it, once every browser the page supports has it, is a known quantity: the conversions
  # must still give native chdman's CHDs byte for byte. Its page is never released (it records no sources).
  exnref:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Emscripten 6.0.10
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/emsdk
          key: emsdk-6.0.10-${{ runner.os }}
      - name: Emscripten 6.0.10 (emsdk)
        run: |
          [ -d ~/emsdk/.git ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install 6.0.10
          ./emsdk activate 6.0.10
      - name: Build with exnref exceptions
        run: |
          source ~/emsdk/emsdk_env.sh
          WASM_EH=exnref ./build.sh
          ~/emsdk/upstream/bin/llvm-objdump -d build/chdman.wasm | grep -q try_table
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: numpy, for the synthetic test discs
        run: pip install numpy==2.4.6
      - name: Cache MAME 0.289 and its chdman
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            third_party/mame
            build/chdman-0.289
          key: mame-0.289-${{ runner.os }}-${{ hashFiles('scripts/fetch-mame.sh', 'scripts/build-upstream.sh', 'wasm/**') }}
      - name: Native chdman (0.289 and the engine)
        run: |
          [ -x build/chdman-0.289 ] || ./scripts/build-upstream.sh
          ./scripts/build-native.sh
      - name: Playwright and Chromium
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Synthetic test discs
        run: python3 tests/fixtures/make_fixtures.py
      - name: Conversions on the exnref page
        working-directory: tests
        env:
          REQUIRE_NATIVE: '1'
        run: npx playwright test ui/smoke.spec.js ui/convert.spec.js ui/window.spec.js ui/fallbacks.spec.js --project=desktop
