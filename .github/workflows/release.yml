name: Release

# Publishes a release: dist/discpress.html as the download (the offline build) and, the same file byte
# for byte, as the online version on GitHub Pages (web/README.md). The two change together:
#   1. prepare: checks that the tag is a version such as v1.3.5 (no prereleases), picks the release's
#      commit (the tag's, or this branch's latest for a new tag), checks that CI passed on it (ci.yml:
#      the whole test suite), that its dist/discpress.html is what the sources make (scripts/check-dist.sh:
#      app/ and db/, and the engine sources its wasm was built from), and packs the download and the site;
#   2. release: creates the release as a draft (or updates an existing one) with the download attached;
#   3. pages: deploys the site, for the newest version only (an older tag's re-run leaves it alone). It
#      asks again right before deploying (scripts/newest-release.sh: tags and releases, drafts too), so
#      re-running an old run's failed jobs never deploys it over a release made since;
#   4. publish: makes the draft public only once the site is deployed, so a failed deploy leaves both
#      at the previous release; it becomes the latest release only if the site now shows it;
#   5. verify: scripts/check-release.sh checks that the download, its .sha256, the site and the site's
#      .sha256 are all that file (release-check.yml repeats the check daily).
# Run it from Actions > Release > Run workflow on main, with a tag such as v1.3.5. A pushed v* tag or a
# release published by hand starts it too: it reruns itself on main for that tag, since only main may
# deploy to GitHub Pages.
# If .github/release-notes/<tag>.md exists on main, it becomes the release notes (replacing what's there
# on every run); otherwise GitHub generates them.
# The deploy needs Pages turned on once: Settings > Pages > Source: GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, such as v1.3.5 (created on the latest commit of the branch run from, if missing)'
        required: true
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  # A tag pushed or a release published by hand: run this workflow on main for that tag.
  forward:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the release on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" -f tag="$TAG"

  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to see draft releases (drafts need write access to read)
      actions: read # CI's runs on the release's commit
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      latest: ${{ steps.pick.outputs.latest }}
      digest: ${{ steps.pick.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Pick the release's commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # Every release becomes the latest and goes online, so a prerelease (v1.4.0-rc1) can't be one:
          # it would replace the current version, and sort -V puts v1.4.0 before it.
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must be a version such as v1.3.5 (no prereleases such as v1.4.0-rc1), got '$TAG'"
            exit 1
          fi
          # the site shows the newest version: an older tag's re-run updates only its release
          # (asked with this commit's script, before checking out the release's)
          latest=$(scripts/newest-release.sh "$TAG")
          draft=$(gh release view "$TAG" --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish' 2>/dev/null || true)
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            sha=$(git rev-parse "$TAG^{commit}")
          elif [ -n "$draft" ]; then
            # a draft left by a run whose deploy failed: the same commit again, even if main moved on
            sha=$(git rev-parse "$draft^{commit}")
          else
            sha=$GITHUB_SHA
          fi
          # only what main holds is released (a v* tag pushed on another branch's commit isn't)
          main="origin/${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$sha" "$main" || { echo "::error::$sha isn't on $main: release only what main holds"; exit 1; }
          git checkout -q "$sha"
          test -f dist/discpress.html || { echo "::error::dist/discpress.html is missing at $sha"; exit 1; }
          {
            echo "sha=$sha"
            echo "latest=$latest"
            echo "digest=$(sha256sum < dist/discpress.html | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG: commit $sha, newest version: $latest"
      - name: CI passed on the release's commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          # the release ships only a commit whose tests passed (CI runs on every push to main)
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::CI hasn't passed on $SHA: wait for its run (or start it: Actions > CI > Run workflow), then run the release again"
            exit 1
          fi
      - name: Check that the page matches its sources
        run: scripts/check-dist.sh
      - name: Pack the download and the site
        run: |
          mkdir -p files _site
          cp dist/discpress.html files/
          (cd files && sha256sum discpress.html > discpress.html.sha256)
          cp dist/discpress.html _site/index.html
          cp files/discpress.html.sha256 web/sw.js web/manifest.webmanifest web/*.png _site/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: download
          path: files
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main, for the release notes
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: download
          path: files
      - name: Create or update the release, with the download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; fi
            # replace the download only if it differs: replacing removes it for a moment
            have=$(gh release download "$TAG" -p discpress.html.sha256 -O - 2>/dev/null | awk '{print $1}' || true)
            if [ "$have" = "$DIGEST" ]; then echo "$TAG already has this download"; exit 0; fi
          else
            # a draft until the site is deployed (publish job); the tag is made when it is published
            if [ -f "$NOTES" ]; then notes=(--notes-file "$NOTES"); else notes=(--generate-notes); fi
            gh release create "$TAG" --draft --target "$SHA" --title "Discpress $TAG" --latest="$LATEST" "${notes[@]}"
          fi
          gh release upload "$TAG" files/discpress.html files/discpress.html.sha256 --clobber

  pages:
    needs: [prepare, release]
    if: needs.prepare.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to see draft releases (scripts/newest-release.sh)
      pages: write
      id-token: write
    # one deploy at a time, in order
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      # main, for scripts/newest-release.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      # asked again here, not taken from prepare: re-running this job of an older run (Re-run failed
      # jobs) must not deploy it over a version released, or drafted, since
      - name: Check that this is still the newest version
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          latest=$(scripts/newest-release.sh "$TAG")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - if: steps.newest.outputs.latest == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deploy
        if: steps.newest.outputs.latest == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  publish:
    needs: [prepare, release, pages]
    # after the site (or without it, for an older tag), never after a failed deploy
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.pages.result == 'success' || needs.pages.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      # main, for scripts/newest-release.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - name: Make the release public
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DEPLOYED: ${{ needs.pages.outputs.deployed }}
        run: |
          # the latest release only if the site now shows it and no newer version was made meanwhile
          latest=false
          if [ "$DEPLOYED" = true ]; then latest=$(scripts/newest-release.sh "$TAG"); fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          else
            echo "$TAG is already public"
          fi

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the download and the online version
        env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
          LATEST: ${{ needs.publish.outputs.latest }}
        # GitHub Pages caches pages for up to 10 minutes
        run: |
          if [ "$LATEST" = true ]; then site=(); else site=(--no-site); fi
          scripts/check-release.sh "$TAG" --expect "$DIGEST" --wait 900 "${site[@]}"
